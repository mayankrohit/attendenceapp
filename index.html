<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Attendance Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

  <!-- Header Navigation -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide">Campus Attendance</h1>
    <div class="flex gap-2">
      <button onclick="switchRole('professor')" id="btn-prof" class="px-3 py-1 bg-indigo-700 hover:bg-indigo-800 rounded text-sm font-medium">Professor View</button>
      <button onclick="switchRole('student')" id="btn-student" class="px-3 py-1 bg-indigo-500 hover:bg-indigo-800 rounded text-sm font-medium">Student View</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4">

    <!-- PROFESSOR VIEW -->
    <section id="professor-view" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-2">Take Class Attendance</h2>
        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Select Subject</label>
        <select id="course-select" class="w-full border rounded-lg p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="11111111-1111-1111-1111-111111111111">DS101 - Data Structures</option>
        </select>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-semibold text-gray-700">Roster</h3>
          <button onclick="markAllPresent()" class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-1 rounded">Mark All Present</button>
        </div>
        <div id="student-roster" class="divide-y text-sm">
          <!-- Dynamically filled by JS -->
        </div>
        <button onclick="submitAttendance()" class="w-full mt-4 bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition">Save Session Attendance</button>
      </div>
    </section>

    <!-- STUDENT VIEW -->
    <section id="student-view" class="hidden space-y-4">
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-5 rounded-2xl shadow-lg">
        <p class="text-xs font-medium uppercase tracking-wider text-indigo-100">Overall Attendance</p>
        <div class="flex items-baseline gap-2 mt-1">
          <span class="text-4xl font-extrabold" id="overall-percentage">85%</span>
          <span class="text-xs text-indigo-200">Above target (75%)</span>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border border-gray-100 space-y-3">
        <h3 class="font-bold text-gray-800">Subject Breakdown</h3>
        <div class="border p-3 rounded-lg flex justify-between items-center">
          <div>
            <p class="font-semibold text-sm">DS101 - Data Structures</p>
            <p class="text-xs text-gray-500">17 / 20 Classes Attended</p>
          </div>
          <span class="px-2.5 py-1 text-xs font-bold bg-green-100 text-green-700 rounded-full">85%</span>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = "https://cybnimvuxhetegdernfu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RCQSZv3AaQ0Z1Gds3_YHpw_R9uVzbtO";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const mockRoster = [
      { id: "00000000-0000-0000-0000-000000000002", name: "Aarav Patel", roll: "24DS001", status: "Present" },
      { id: "00000000-0000-0000-0000-000000000003", name: "Ananya Iyer", roll: "24DS002", status: "Present" },
      { id: "00000000-0000-0000-0000-000000000004", name: "Rohan Mehta", roll: "24DS003", status: "Absent" }
    ];

    function renderRoster() {
      const container = document.getElementById("student-roster");
      container.innerHTML = mockRoster.map((s, idx) => `
        <div class="py-3 flex justify-between items-center">
          <div>
            <p class="font-medium text-gray-800">${s.name}</p>
            <p class="text-xs text-gray-400">${s.roll}</p>
          </div>
          <div class="flex gap-1">
            <button onclick="toggleStatus(${idx}, 'Present')" class="px-2.5 py-1 text-xs rounded font-semibold ${s.status === 'Present' ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-600'}">P</button>
            <button onclick="toggleStatus(${idx}, 'Absent')" class="px-2.5 py-1 text-xs rounded font-semibold ${s.status === 'Absent' ? 'bg-rose-500 text-white' : 'bg-gray-100 text-gray-600'}">A</button>
          </div>
        </div>
      `).join('');
    }

    function toggleStatus(idx, status) {
      mockRoster[idx].status = status;
      renderRoster();
    }

    function markAllPresent() {
      mockRoster.forEach(s => s.status = 'Present');
      renderRoster();
    }

    async function submitAttendance() {
      const courseId = document.getElementById("course-select").value;
      const { data: session, error: sErr } = await db.from('sessions').insert([{ course_id: courseId }]).select().single();
      
      if (sErr) return alert("Error creating session: " + sErr.message);

      const records = mockRoster.map(s => ({
        session_id: session.id,
        student_id: s.id,
        status: s.status
      }));

      const { error: rErr } = await db.from('attendance_records').insert(records);
      if (rErr) alert("Error saving records: " + rErr.message);
      else alert("Attendance Saved Successfully!");
    }

    function switchRole(role) {
      document.getElementById("professor-view").classList.toggle("hidden", role !== 'professor');
      document.getElementById("student-view").classList.toggle("hidden", role !== 'student');
    }

    renderRoster();
  </script>
</body>
</html>
